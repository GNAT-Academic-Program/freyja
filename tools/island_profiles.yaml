# Layout profiles for tools/islands.py, one per IC family, each derived from the
# datasheet layout example. The audit behind every entry is ref/island-layouts.md.
# Keys are substrings of the anchor's Value field. Rules run in order; a part takes
# the first rule that matches it; parts no rule matches get the generic rules.
#
#   match:  prefix: R|C|L     reference prefix
#           pin: ROLE         the part has a pad on the net of that pin
#           cap_between: [A, B]   a capacitor between the nets of pins A and B;
#                             OUT is the regulator output rail, GND is GND
#           between: [A, B]   any part whose two nets are the nets of pins A and B
#                             (a divider resistor between OUT and FB, or FB and GND)
#           value: 4.7uF      the Value field's first token (4u7, 4.7uF, 4.7 uF match)
#   place:  side: ROLE        a row outside the side holding that pin, the pad on
#                             the pin's net facing it
#           outside: NAME     the row starts beyond the parts an earlier rule NAME
#                             placed (stacking inner to outer, as in a figure)
#           flank: ROLE       a row on the flank next to that pin's corner, level
#           flank: opposite ROLE   with the IC; or the opposite flank
#           face: {NET: dir}  the pad on NET (a pin role, OUT or GND) points
#                             inward, outward, N, E, S or W (chip frame, as in the
#                             datasheet figure at rotation 0); a pad pointing along
#                             the edge makes the part lie along it, which is how
#                             a flank is filled compactly
#           overhang: MM      a side row may pass the corners by MM (small packages:
#                             two 0603 across a 2.7 mm WQFN side need 0.3)
#           at: pin           a flank part sits at the pin's corner, not mid-flank
#           dir: N|E|S|W      a row on that side (figure frame), each part at its own
#           dir: inboard      pin; inboard/outboard is the long side facing the board
#                             centre or away from it (a chunk in the lot: S or E)
#           lie: along        the part lies lengthwise along the edge
#           gap: MM           distance from the anchor courtyard for this rule
#                             (default --ring-gap)
#   figure_rotation: R  the footprint rotation at which it looks like the datasheet
#                       figure; face directions are the figure's own. Check the
#                       footprint's pin positions at rotation 0 against the figure
#                       before writing a profile (the TSOT26 is upside down).
#
# General rules (learned on U13, 2026-10-28): caps on one node share one outward
# GND edge so one pour strip serves them; parts beside a flank lie along it and
# stack along it; a divider's shared-net pads sit in one column at the pin they
# serve.

TLV62569:
  source: TLV62569 datasheet SLVSDG1C, 10.1 Layout Guidelines and 10.2 Layout Example, Figure 21 (DRL); output caps and divider amended by hand on U13 (ref/island-layouts.md)
  pins: {FB: 1, GND: 2, VIN: 3, SW: 4, EN: 5}
  rules:
    - name: inductor at SW
      match: {prefix: L, pin: SW}
      place: {side: SW}
    # Known defect, found when U13 and U14 were routed (findings.md, 2026-11-05): on the DRL
    # package VIN (3) and GND (2) are neighbours in one pin row, so "VIN flank" leaves the
    # 100 nF beside the package with +5V at the SW pin. It belongs across pins 3 and 2,
    # outward from the row, with the 4.7 uF behind or beside it. U13, U14 and U16 were all
    # corrected by hand on the board. Do not re-run those islands from this profile.
    - name: input cap on the VIN flank, GND toward the GND pin row
      match: {cap_between: [VIN, GND]}
      place: {flank: VIN, face: {GND: S}}
    - name: output caps along the far flank, one shared GND edge outward
      match: {cap_between: [OUT, GND]}
      place: {flank: opposite VIN, face: {GND: outward}}
    - name: feedback divider along the FB row, FB pads in one column at pin FB
      match: {prefix: R, pin: FB}
      place: {side: FB, face: {FB: W}}
    - name: enable pull-down at EN
      match: {prefix: R, pin: EN}
      place: {side: EN}

TPS22950:
  source: TPS22950 datasheet SLVSFJ2B, 10.4.1 Layout Guidelines and Figure 10-4 (SOT6 layout example)
  pins: {ON: 1, VIN: 2, GND: 3, ILIM: 4, VOUT: 5, FLT: 6}
  rules:
    - name: input cap at VIN
      match: {cap_between: [VIN, GND]}
      place: {side: VIN}
    - name: current-limit resistor at ILIM
      match: {prefix: R, pin: ILIM}
      place: {side: ILIM}

SN74LVC8T245:
  source: SN74LVC8T245 datasheet SCES584D, 8.3 Power Supply Recommendations and 8.4.1 Layout Guidelines (0.1 uF bypass capacitor at each VCC pin, as close as possible; same pin order and the same placement as the LXC figure it replaces)
  pins: {VCCA: 1, DIR: 2, GND: 12, OE: 22, VCCB: 24}
  rules:
    - name: VCCA bypass at pin 1, GND toward the shared via
      match: {cap_between: [VCCA, GND]}
      place: {side: VCCA, face: {GND: N}}
    - name: VCCB bypass at pin 24, GND toward the shared via
      match: {cap_between: [VCCB, GND]}
      place: {side: VCCB, face: {GND: S}}
    - name: OE pull-up at pin 22
      match: {prefix: R, pin: OE}
      place: {side: OE}

TPD12S016:
  source: TPD12S016 datasheet SLLSE96F, 10.1 Layout Guidelines and 10.2 Figure 19 (RKT layout example; the PW package keeps the same pin order), Figure 18 for the three 0.1 uF caps
  pins: {CEC_A: 1, LS_OE: 5, GND: 6, VCC5V: 11, CT_HPD: 12, 5V_OUT: 13, VCCA: 24}
  rules:
    - name: VCCA bypass at pin 24
      match: {cap_between: [VCCA, GND]}
      place: {side: VCCA}
    - name: VCC5V bypass at pin 11
      match: {cap_between: [VCC5V, GND]}
      place: {side: VCC5V}
    - name: 5V_OUT bypass at pin 13
      match: {cap_between: [5V_OUT, GND]}
      place: {side: 5V_OUT}
    - name: CT_HPD pull-up at pin 12
      match: {prefix: R, pin: CT_HPD}
      place: {side: CT_HPD}
    - name: LS_OE pull-up at pin 5
      match: {prefix: R, pin: LS_OE}
      place: {side: LS_OE}

RP2350:
  source: RP2350 datasheet 6.3.8 External components and PCB layout requirements, Figure 26 (Pico 2 regulator layout, pins FB VIN LX PGND AVDD left to right); one 100 nF per power pin per RP-008280 2.2.1 is left to the generic ring
  pins: {AVDD: 61, PGND: 62, LX: 63, VIN: 64, FB: 65}
  rules:
    # Figure 26, inner to outer on the regulator pin side: CIN lies across VIN
    # and PGND against the pins, COUT lies just outside it (must sit between
    # VREG_VIN and VREG_PGND), the inductor outermost with its LX pad over the
    # LX/PGND end; the AVDD RC filter stands in a column at the AVDD end, CFILT
    # inner with its GND pad toward the chip, RFILT outer with the AVDD pad
    # toward the chip. CIN keeps its own GND via; CFILT shares no via with
    # CIN/COUT (6.3.8.1).
    - name: CIN
      match: {cap_between: [VIN, GND], value: 4.7uF}
      place: {side: VIN, face: {GND: E}}
    - name: COUT
      match: {cap_between: [OUT, GND], value: 4.7uF}
      place: {side: LX, face: {GND: E}, outside: CIN}
    - name: L
      match: {prefix: L, pin: LX}
      place: {side: LX, face: {LX: E}, outside: COUT}
    - name: CFILT
      match: {cap_between: [AVDD, GND]}
      place: {side: AVDD, face: {GND: inward}}
    - name: RFILT
      match: {prefix: R, pin: AVDD}
      place: {side: AVDD, face: {AVDD: inward}, outside: CFILT}

LMR33630:
  source: LMR33630 datasheet SNVSAN3F (TI, rev. November 2020), 10.1 Layout Guidelines (1 to 9) and 10.2 Figure 10-2 Example Layout for the HSOIC (DDA) package; pin table 6-1 (HSOIC 1 PGND, 2 VIN, 3 EN, 4 PG, 5 FB, 6 VCC, 7 BOOT, 8 SW, pad AGND)
  pins: {GND: 1, VIN: 2, EN: 3, PG: 4, FB: 5, VCC: 6, BOOT: 7, SW: 8}
  # Imported ESOP-8 at rotation 0: pins 1 to 4 down the W side (PGND, VIN,
  # EN, PG), 5 to 8 up the E side (FB, VCC, BOOT, SW), the pad in the
  # middle. Figure 10-2 (same orientation): CIN and the 220 nF CHF across
  # VIN and PGND on the W side with the smallest loop (guideline 1); the
  # inductor E of SW; CBOOT between BOOT and SW with short wide traces (3);
  # the VCC capacitor at pin 6 (2); COUT along the N edge from the inductor
  # toward the GND copper; RFBT and RFBB at FB on the E side, bottom corner,
  # away from the SW node (4); the pad on a 4 x 3 via array (10.1.1).
  rules:
    - name: high-frequency input bypass across VIN and PGND
      match: {cap_between: [VIN, GND], value: 220nF 50V}
      place: {side: VIN, face: {GND: N}}
    - name: input bulk capacitor outside the bypass
      match: {cap_between: [VIN, GND]}
      place: {side: VIN, face: {GND: N}, outside: high-frequency input bypass across VIN and PGND}
    - name: inductor at SW
      match: {prefix: L, pin: SW}
      place: {side: SW}
    - name: bootstrap cap on the E flank at BOOT, SW pad toward SW
      match: {cap_between: [BOOT, SW]}
      place: {flank: BOOT, face: {SW: N}}
    - name: VCC capacitor at pin 6
      match: {cap_between: [VCC, GND]}
      place: {side: VCC, face: {GND: S}}
    - name: output caps along the N flank from the SW corner
      match: {cap_between: [OUT, GND]}
      place: {flank: SW, face: {GND: W}}
    - name: upper divider at FB
      match: {prefix: R, between: [OUT, FB]}
      place: {side: FB, face: {FB: N}}
    - name: lower divider outside the upper one
      match: {between: [FB, GND]}
      place: {side: FB, face: {FB: N}, outside: upper divider at FB}

TPS25942:
  source: "TPS25942A datasheet SLVSCE9D, 12.1 Layout Guidelines and 12.2 Figure 88 Board Layout; pin table section 6 (RVC WQFN-20: 1 DMODE, 2 PGOOD, 3 PGTH, 4-8 OUT, 9-13 IN, 14 EN/UVLO, 15 OVP, 16 GND, 17 ILIM, 18 dVdT, 19 IMON, 20 FLT)"
  pins: {UVLO: 14, OVP: 15, FLT: 20, IN: 11, OUT: 6, DVDT: 18, GND: 16, ILIM: 17, IMON: 19}
  # Directions are the imported footprint's at rotation 0: pins 1 to 6 along
  # the S edge (DMODE, PGOOD, PGTH, OUT x3), 7 to 10 up the E side (OUT, OUT,
  # IN, IN), 11 to 16 along the N edge from E to W (IN x3, EN, OVP, GND), 17
  # to 20 down the W side (ILIM, dVdT, IMON, FLT). 12.1: the IN bypass closest
  # to the IN and GND terminals with the smallest loop; RILIM, CdVdT, RIMON
  # and the UVLO/OVP resistors close to their pins, their other end to the
  # signal ground by the shortest trace, those traces away from switching
  # signals; the PowerPAD on a via field. Figure 88 shows the bypass capacitor
  # across the IN pins and the support parts in a row off the W side.
  rules:
    - name: input cap at the IN pins
      match: {cap_between: [IN, GND]}
      place: {side: IN, face: {GND: W}}
    - name: dVdT cap at pin 18 on the W side
      match: {cap_between: [DVDT, GND]}
      place: {side: DVDT}
    - name: ILIM resistor at pin 17
      match: {between: [ILIM, GND]}
      place: {side: ILIM, overhang: 0.3}
    - name: IMON resistor at pin 19
      match: {between: [IMON, GND]}
      place: {side: IMON, overhang: 0.3}
    - name: UVLO string resistors at pin 14 along the N edge
      match: {prefix: R, pin: UVLO}
      place: {side: UVLO, overhang: 0.3}
    - name: OVP string resistor at pin 15 outside the UVLO resistors
      match: {prefix: R, pin: OVP}
      place: {side: OVP, outside: UVLO string resistors at pin 14 along the N edge, overhang: 0.3}

TPS564201:
  source: "TPS564201 datasheet SLVSDJ7B, 10.1 Layout Guidelines (1 to 10) and 10.2 Layout Example; pin table section 5 (DDC SOT-23-6: 1 GND, 2 SW, 3 VIN, 4 VFB, 5 EN, 6 VBST)"
  pins: {GND: 1, SW: 2, VIN: 3, VFB: 4, EN: 5, VBST: 6}
  # SOT-23-6: GND, SW, VIN down one side, VFB, EN, VBST down the other.
  # 10.1: input and output capacitors as close as possible (2), the input
  # capacitor across VIN and GND on their own side; SW trace short and wide
  # (4), the inductor at SW; the bootstrap capacitor across VBST and SW (the
  # example puts it at the VBST corner); the feedback divider at VFB with a
  # Kelvin return to the GND pin (6, 7, 9), away from SW (8); no switching
  # current under the device (5).
  rules:
    - name: input cap across VIN and GND
      match: {cap_between: [VIN, GND]}
      place: {side: VIN, face: {GND: N}}
    - name: inductor at SW
      match: {prefix: L, pin: SW}
      place: {side: SW}
    - name: bootstrap cap at the VBST corner, SW pad toward SW
      match: {cap_between: [VBST, SW]}
      place: {flank: VBST, face: {SW: N}}
    - name: output caps beyond the inductor
      match: {cap_between: [OUT, GND]}
      place: {side: SW, outside: inductor at SW}
    - name: upper divider at VFB
      match: {prefix: R, between: [OUT, VFB]}
      place: {side: VFB, face: {VFB: N}}
    - name: lower divider outside the upper one, GND toward the GND pin
      match: {between: [VFB, GND]}
      place: {side: VFB, face: {VFB: N}, outside: upper divider at VFB}
    - name: enable pull-down at EN
      match: {prefix: R, pin: EN}
      place: {side: EN}

B254N02-0B7P51:
  source: no datasheet layout (a 7-pin power header, the Boom B254N02 since 2026-10-30, the XFCN PM254V-11-07 before); owner's own hand placement of slot rows J53, J62, J54, J63, J55 on the morning of 2026-10-28 (check_positions snapshot before the first island apply), pins 1 PIN_VOLTAGE, 2 GND, 3 3V3, 4 GND, 5 5V, 6 GND, 7 AUX
  pins: {PINV: 1, V3: 3, V5: 5, AUX: 7}
  rules:
    # The owner's rows: one line 2.3 to 2.5 mm off the pins on the side facing
    # the board edge, in pin order: fuse and 10 uF on PIN_VOLTAGE, fuse and
    # 100 nF on 3V3, fuse on 5V, each at its own pin; the AUX fuse on the
    # side facing the board centre, near the pin 1 end, 4.3 mm off the pins.
    - name: AUX fuse on the inboard side
      match: {pin: AUX}
      place: {dir: inboard}
    # The key post stands one pitch before pin 1 on the row line (findings
    # 51); the outboard row runs past pin 1 and its 10 uF landed on the
    # post's courtyard (re-audit 2026-10-29). The PIN V fuse and bulk go
    # inboard, at their own pin, on the AUX fuse's row: 4.3 mm off the pin
    # line, where the post's courtyard (1.5 mm each side of the line) is
    # not reached. The outboard row keeps the 3V3 and 5V parts.
    - name: PIN V fuse and bulk capacitor on the inboard side, clear of the key post
      match: {pin: PINV}
      place: {dir: inboard}
    - name: slot power row on the outboard side
      match: {}
      place: {dir: outboard, lie: along, gap: 0.15, overhang: 1.5}

LINK :
  source: no layout figure; TI TPD4E1U06 datasheet guidance (ESD arrays as close to the connector pins as possible, before any other part on the line) and the RJ45 pin row on the N edge of the footprint at rotation 0
  pins: {}
  rules:
    - name: ESD arrays in one row along the pin edge, each at its own pins
      match: {prefix: D}
      place: {dir: N}

TPS22975:
  source: TPS22975 datasheet SLVSDD0B, 12.1 Layout Guidelines (input and output capacitors close to the device, wide VIN/VOUT/GND, the CT trace as short as possible) and 12.2 Layout Example (VIN bypass at pins 1-2, VOUT bypass at pins 7-8, CT at pin 6, vias under the pad); DSG pins 1-2 VIN, 3 ON, 4 VBIAS, 5 GND, 6 CT, 7-8 VOUT
  pins: {VIN: 1, ON: 3, VBIAS: 4, GND: 5, CT: 6, VOUT: 7}
  rules:
    - name: input bypass at the VIN pins
      match: {cap_between: [VIN, GND]}
      place: {side: VIN}
    - name: output bypass at the VOUT pins
      match: {cap_between: [VOUT, GND]}
      place: {side: VOUT}
    - name: VBIAS bypass at pin 4
      match: {cap_between: [VBIAS, GND]}
      place: {side: VBIAS}
    - name: CT capacitor at pin 6, shortest trace
      match: {prefix: C, pin: CT}
      place: {side: CT}

TPS2121:
  source: TPS2121 datasheet SLVSEA3F, 12.1 Layout Guidelines (short wide IN1/IN2/OUT copper, vias under the input and output pins) and 11 Power Supply Recommendations (bypass on IN1, IN2 and OUT close to the pins); the control dividers have no placement guidance and take the signal rule
  pins: {OUT: 1, IN2: 2, CP2: 3, OV2: 4, OV1: 5, PR1: 6, IN1: 7, ST: 9, ILIM: 10, SS: 11, GND: 12}
  rules:
    - name: IN1 bypass
      match: {cap_between: [IN1, GND]}
      place: {side: IN1}
    - name: IN2 bypass, innermost at pin 2 (the bulk on this node is U11's)
      match: {cap_between: [IN2, GND]}
      place: {side: IN2}
    - name: output bulk at OUT
      match: {cap_between: [OUT, GND]}
      place: {side: OUT}
    - name: soft-start capacitor at SS
      match: {prefix: C, pin: SS}
      place: {side: SS}
    - name: current-limit resistor at ILIM
      match: {prefix: R, pin: ILIM}
      place: {side: ILIM}
    - name: PR1 divider at pin 6
      match: {prefix: R, pin: PR1}
      place: {side: PR1}
    - name: OV1 divider at pin 5
      match: {prefix: R, pin: OV1}
      place: {side: OV1}
    - name: CP2 divider at pin 3
      match: {prefix: R, pin: CP2}
      place: {side: CP2}

HUSB238:
  source: Hynetek HUSB238 datasheet rev 2.0, VIN PIN ("connect a 1 uF decoupling MLCC between VIN and GND as close as possible"), Figure 4 application circuit; no layout page, so the strap resistors and the I2C pull-ups go at their pins by common practice [verify]
  pins: {VIN: 1, CC1: 4, CC2: 5, SDA: 6, SCL: 7, VSET: 8, ISET: 9, GND: 11}
  # Imported DFN-10 at rotation 0: pins 1 to 5 along the S edge from W to E
  # (VIN, D+, D-, CC1, CC2), 6 to 10 along the N edge from E to W (SDA, SCL,
  # VSET, ISET, GATE), the pad in the middle.
  rules:
    - name: VIN bypass at pin 1
      match: {cap_between: [VIN, GND]}
      place: {side: VIN}
    - name: VSET and ISET straps at pins 8 and 9
      match: {prefix: R, pin: VSET}
      place: {side: VSET, overhang: 0.3}
    - name: ISET strap beside VSET
      match: {prefix: R, pin: ISET}
      place: {side: ISET, overhang: 0.3}
    - name: I2C pull-ups at pins 6 and 7
      match: {prefix: R, pin: SDA}
      place: {side: SDA, overhang: 0.3}
    - name: SCL pull-up beside SDA
      match: {prefix: R, pin: SCL}
      place: {side: SCL, overhang: 0.3}
